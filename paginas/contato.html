<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Leonardo Balk</title>
    <link rel="stylesheet" href="./../css/style.css">
</head>

<body>
    <header class="topo">
        <div class="container nav">
            <a class="brand" href="./../index.html">
                <span class="brand-nome">Leonardo Balk</span>
            </a>
            <nav aria-label="principal">
                <ul class="menu">
                    <li><a href="./../index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="contato.html" aria-current="page">Contato</a></li>
                </ul>
            </nav>
            <button id="toggle-theme" class="btn"
                style="margin-left: 20px; padding: 6px 12px; font-size: 14px;">Tema</button>
        </div>
    </header>

    <!-- conteudo -->
    <main>
        <div class="container">
            <section class="bloco">
                <h1>Contato</h1>
                <hr>

                <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
                    <form action="#" method="post" class="form" style="flex: 1; min-width: 300px;">
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Seu Nome" required>
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Seu E-mail" required>
                        </div>

                        <div class="campo">
                            <label for="assunto">Assunto</label>
                            <input type="text" id="assunto" name="assunto" placeholder="Assunto da Mensagem" required>
                        </div>

                        <div class="campo">
                            <label for="mensagem">Mensagem</label>
                            <textarea id="mensagem" name="mensagem" rows="6" placeholder="Sua Mensagem"
                                required></textarea>
                        </div>

                        <button type="submit" class="btn">Enviar</button>
                    </form>

                    <div class="contato-info" style="flex: 1; min-width: 250px;">
                        <h2>Outros Canais</h2>
                        <ul class="lista" style="list-style: none; padding: 0;">
                            <li style="margin-bottom: 12px;">
                                <strong>E-mail:</strong><br>
                                <a href="mailto:leonardo.balk01@gmail.com">leonardo.balk01@gmail.com</a>
                            </li>
                            <li style="margin-bottom: 12px;">
                                <strong>WhatsApp:</strong><br>
                                <a href="https://wa.me/5555996432639" target="_blank">(+55) 55 99643-2639</a>
                            </li>
                            <li style="margin-bottom: 12px;">
                                <strong>LinkedIn:</strong><br>
                                <a href="https://linkedin.com/in/leonardobalk"
                                    target="_blank">linkedin.com/in/leonardobalk</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>

</html>
